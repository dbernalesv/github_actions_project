name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run the tests.
        required: true
        type: string
      image-name:
        description: Local image name used to validate the Docker build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    name: Run tests and build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build container image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: docker build --pull --tag "${IMAGE_NAME}:ci" .
