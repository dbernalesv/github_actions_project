name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ejecutar pruebas reutilizables
    uses: dbernalesv/github_actions_templates/.github/workflows/python-tests.yml@fcf48037f6e4b186a884a944f8bf2c2327d5fa47
    with:
      python-version: "3.12"

  publish:
    name: Publicar imagen en Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    uses: dbernalesv/github_actions_templates/.github/workflows/docker-publish.yml@fcf48037f6e4b186a884a944f8bf2c2327d5fa47
    with:
      image-name: diegobernales/github_actions_project
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
